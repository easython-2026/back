spring.application.name=easython

# DB: 기본은 H2(MySQL 모드, 메모리). MySQL은 환경변수로 지정 (README 참고)
spring.datasource.url=${DB_URL:jdbc:h2:mem:easython;MODE=MySQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

spring.messages.fallback-to-system-locale=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# JWT: 운영에서는 반드시 JWT_SECRET 환경변수로 32바이트 이상 비밀값 지정
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
app.jwt.access-minutes=30
app.jwt.refresh-days=14

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
app.gps.default-radius-meters=100

# 출퇴근 GPS: 위치 정확도가 이 값(m)보다 나쁘면 LOW_ACCURACY
app.gps.max-accuracy-meters=100

# 증거 사진 저장(로컬 디스크). 서명 URL은 만료되며 URL 서명 키는 기본적으로 JWT 키 재사용
app.storage.backend=${STORAGE_BACKEND:local}
app.storage.s3.region=${AWS_REGION:}
app.storage.s3.bucket=${S3_BUCKET:}
app.storage.local-dir=${STORAGE_DIR:${user.home}/easython-uploads}
app.storage.public-base-url=${PUBLIC_BASE_URL:}
app.storage.url-secret=${app.jwt.secret}

# 데모 시드 API (배포 환경에서는 DEMO_ENABLED=false)
app.demo.enabled=${DEMO_ENABLED:true}

# AI: 키는 환경변수로만. AI_API_KEY(없으면 DKU_API_KEY). 키가 없으면 데모용 모의 응답(MockAiClient).
# AI_PROVIDER=mock 으로 강제 모의 가능. 코드/로그에 키를 남기지 않는다.
app.ai.provider=${AI_PROVIDER:}
app.ai.base-url=${AI_BASE_URL:https://dku-chat.kloud.zone/llm/v1}
app.ai.api-key=${AI_API_KEY:${DKU_API_KEY:}}
app.ai.model=${AI_MODEL:anthropic/claude-haiku-4.5}
app.ai.timeout-seconds=90

# 최저임금(시급, 원). 매년 고시값으로 갱신 필요.
app.payroll.min-wage-hourly=10320
app.payroll.min-wage-year=2026

# 진정서 PDF 한글 폰트(TTF) 경로. 비우면 시스템 폰트를 찾는다. 배포 서버에서는 Noto Sans KR 등을 지정.
app.pdf.font-path=${PDF_FONT_PATH:}

# 데모 상담기관 담당자 계정 비밀번호(DEMO_ENABLED=true 일 때만 시드). 배포 시 DEMO_ENABLED=false
app.demo.staff-password=${DEMO_STAFF_PASSWORD:Test1234!}

# 메일(비밀번호 재설정). Gmail: 2단계 인증 후 앱 비밀번호 발급. 비우면 메일을 보내지 않는다.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
