server.address=127.0.0.1
server.forward-headers-strategy=framework

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}

app.demo.enabled=false
app.jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ORIGINS}
app.storage.public-base-url=${PUBLIC_BASE_URL}
app.storage.backend=s3
app.storage.s3.region=${AWS_REGION}
app.storage.s3.bucket=${S3_BUCKET}
app.pdf.font-path=${PDF_FONT_PATH}
app.ai.provider=${AI_PROVIDER:gateway}

spring.mail.properties.mail.smtp.starttls.required=true
