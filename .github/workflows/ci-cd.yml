name: CI/CD

# PR·push: 테스트와 빌드. main 에 반영되면 Docker 이미지를 ECR 에 올리고 ASG 를 롤링 교체(ALB 뒤 EC2 2대).
# 비밀값은 GitHub Secrets → SSM Parameter Store(SecureString). AWS 접근은 OIDC 임시 자격 증명(장기 키 없음).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and build JAR
        run: ./gradlew test bootJar --no-daemon
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
      - name: Upload JAR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: build/libs/easython-0.0.1-SNAPSHOT.jar
          retention-days: 7

  deploy:
    name: Deploy (Docker → ECR → ASG)
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    environment: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      ASG: easython-asg
      REPO: easython
      HEALTH_URL: ${{ vars.HEALTH_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: app-jar
          path: build/libs
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build and push image
        env:
          B: ${{ vars.DEPLOY_BUCKET }}
        run: |
          aws s3 cp --only-show-errors --recursive "s3://$B/assets/" build/docker-assets/
          REGISTRY=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.$AWS_REGION.amazonaws.com
          aws ecr get-login-password | docker login -u AWS --password-stdin "$REGISTRY"
          docker build -t "$REGISTRY/$REPO:$GITHUB_SHA" .
          docker push "$REGISTRY/$REPO:$GITHUB_SHA"

      - name: Store server env in SSM Parameter Store (secrets stay masked)
        env:
          DB_URL: ${{ vars.DB_URL }}
          DB_USERNAME: ${{ vars.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          APP_AWS_REGION: ${{ vars.AWS_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          PDF_FONT_PATH: ${{ vars.PDF_FONT_PATH }}
        run: |
          umask 077
          # docker --env-file 형식(따옴표 없이 KEY=value)
          {
            echo "DEMO_ENABLED=false"
            echo "DB_URL=$DB_URL"
            echo "DB_USERNAME=$DB_USERNAME"
            echo "DB_PASSWORD=$DB_PASSWORD"
            echo "DDL_AUTO=validate"
            echo "JWT_SECRET=$JWT_SECRET"
            echo "CORS_ORIGINS=$CORS_ORIGINS"
            echo "PUBLIC_BASE_URL=$PUBLIC_BASE_URL"
            echo "AWS_REGION=$APP_AWS_REGION"
            echo "S3_BUCKET=$S3_BUCKET"
            echo "AI_PROVIDER=$AI_PROVIDER"
            echo "AI_API_KEY=$AI_API_KEY"
            echo "MAIL_HOST=smtp.gmail.com"
            echo "MAIL_PORT=587"
            echo "MAIL_USERNAME=$MAIL_USERNAME"
            echo "MAIL_PASSWORD=$MAIL_PASSWORD"
            echo "PDF_FONT_PATH=$PDF_FONT_PATH"
          } > "$RUNNER_TEMP/app.env"
          # 실패 시 되돌릴 이전 값(버전 번호와 태그만 보관)
          PREV_ENV_VERSION=$(aws ssm get-parameter --name /easython/env --query Parameter.Version --output text)
          PREV_TAG=$(aws ssm get-parameter --name /easython/image-tag --query Parameter.Value --output text)
          test -n "$PREV_ENV_VERSION" && test -n "$PREV_TAG"
          printf "PREV_ENV_VERSION=%s\nPREV_TAG=%s\n" "$PREV_ENV_VERSION" "$PREV_TAG" >> "$GITHUB_ENV"
          aws ssm put-parameter --name /easython/env --type SecureString --overwrite --value "file://$RUNNER_TEMP/app.env" > /dev/null
          rm -f "$RUNNER_TEMP/app.env"
          aws ssm put-parameter --name /easython/image-tag --type String --overwrite --value "$GITHUB_SHA" > /dev/null

      - name: Rolling replace and public health check
        run: bash deploy/refresh-asg.sh deploy

      - name: Restore previous image and settings across the ASG
        if: failure() && env.PREV_TAG != '' && env.PREV_ENV_VERSION != ''
        run: bash deploy/refresh-asg.sh rollback
