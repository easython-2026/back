name: CI/CD

# PR·push: 테스트와 빌드. main 에 반영되면 production 환경으로 EC2 에 배포.
# 비밀값은 GitHub production Environment Secrets, AWS 접근은 OIDC 임시 자격 증명(장기 키 없음).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build JAR
        run: ./gradlew test bootJar --no-daemon
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
      - name: Upload JAR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/easython-0.0.1-SNAPSHOT.jar
          retention-days: 7

  deploy:
    name: Deploy to EC2
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: dist
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build server env file (secrets stay masked)
        env:
          DB_URL: ${{ vars.DB_URL }}
          DB_USERNAME: ${{ vars.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          APP_AWS_REGION: ${{ vars.AWS_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          PDF_FONT_PATH: ${{ vars.PDF_FONT_PATH }}
        run: |
          umask 077
          q() { printf '%s="%s"\n' "$1" "$2"; }
          {
            q DEMO_ENABLED false
            q DB_URL "$DB_URL"
            q DB_USERNAME "$DB_USERNAME"
            q DB_PASSWORD "$DB_PASSWORD"
            q DDL_AUTO validate
            q JWT_SECRET "$JWT_SECRET"
            q CORS_ORIGINS "$CORS_ORIGINS"
            q PUBLIC_BASE_URL "$PUBLIC_BASE_URL"
            q AWS_REGION "$APP_AWS_REGION"
            q S3_BUCKET "$S3_BUCKET"
            q AI_PROVIDER "$AI_PROVIDER"
            q AI_API_KEY "$AI_API_KEY"
            q MAIL_HOST smtp.gmail.com
            q MAIL_PORT 587
            q MAIL_USERNAME "$MAIL_USERNAME"
            q MAIL_PASSWORD "$MAIL_PASSWORD"
            q PDF_FONT_PATH "$PDF_FONT_PATH"
          } > "$RUNNER_TEMP/app.env"

      - name: Upload release to S3
        env:
          B: ${{ vars.DEPLOY_BUCKET }}
        run: |
          aws s3 cp --only-show-errors dist/easython-0.0.1-SNAPSHOT.jar "s3://$B/releases/$GITHUB_SHA.jar"
          aws s3 cp --only-show-errors deploy/remote-deploy.sh "s3://$B/releases/$GITHUB_SHA-deploy.sh"
          aws s3 cp --only-show-errors --sse AES256 "$RUNNER_TEMP/app.env" "s3://$B/env/$GITHUB_SHA.env"
          rm -f "$RUNNER_TEMP/app.env"

      - name: Deploy via SSM
        env:
          B: ${{ vars.DEPLOY_BUCKET }}
          IID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          CMD="aws s3 cp --only-show-errors s3://$B/releases/$GITHUB_SHA-deploy.sh /tmp/easython-deploy.sh && bash /tmp/easython-deploy.sh $B $GITHUB_SHA; rc=\$?; rm -f /tmp/easython-deploy.sh; exit \$rc"
          CID=$(aws ssm send-command --instance-ids "$IID" --document-name AWS-RunShellScript \
            --comment "easython deploy $GITHUB_SHA" --timeout-seconds 600 \
            --parameters "$(jq -cn --arg c "$CMD" '{commands: [$c]}')" --query Command.CommandId --output text)
          echo "SSM command: $CID"
          for _ in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query '[StandardOutputContent,StandardErrorContent]' --output text
          echo "Status: $STATUS"
          test "$STATUS" = "Success"

      - name: Public health check
        run: curl -fsS --retry 5 --retry-delay 3 "${{ vars.HEALTH_URL }}" > /dev/null && echo healthy
