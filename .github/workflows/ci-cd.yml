name: CI

# PR·push: 테스트와 빌드.
# 해커톤 운영 서버(AWS)는 종료되어 배포 단계(ECR·ASG 롤링 배포)는 제거했다.
# 다시 배포하려면 git 기록의 이전 ci-cd.yml 과 deploy/README.md 를 참고한다.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and build JAR
        run: ./gradlew test bootJar --no-daemon
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
